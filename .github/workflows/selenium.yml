name: Selenium Java UI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    name: Java 21 / Headless Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run Selenium JUnit tests
        run: mvn -B --no-transfer-progress verify -Dbrowser=chrome -Dheadless=true
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-evidence
          path: |
            target/surefire-reports/
            target/screenshots/
          if-no-files-found: warn
          retention-days: 14
